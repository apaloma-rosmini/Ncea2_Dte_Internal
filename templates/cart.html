<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="{{ url_for('static', filename='css/cart.css') }}">

<title>Cart</title>


</head>
<body>


<div class="cart-container">

<!-- Back Button -->
<button class="btn back-btn" onclick="window.history.back()">← Back</button>     <!-- Back button to previous page -->

    <h1>Your Cart</h1>

    <div id="cart-items"></div>

    <!-- Display Total Section -->
    <div class="total-section">
        <h2 id="total-price">Total: $0.00</h2>     <!-- Price starts at $0.00 -->
        <a href="/checkout">
            <button class="btn">Checkout</button>
        </a>
    </div>

</div>

<script>
// Retrieves Data from Database
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// Groups duplicate items and increases quality
let grouped = {};

cart.forEach(item => {
    if (!grouped[item.id]) {
        grouped[item.id] = {
            ...item,
            quantity: 1
        };
    } else {
        grouped[item.id].quantity++;
    }
});


const container = document.getElementById("cart-items");
let total = 0;

// Gets items from database and displays items
Object.values(grouped).forEach(item => {

    let itemTotal = item.price * item.quantity;
    total += itemTotal; // Times price of item * quantity which eqluals the total 

    const div = document.createElement("div");
    div.classList.add("cart-item");  // Puts the cart items into css 

    // HTML
    div.innerHTML = `
        <img src="${item.image}">
        <div class="cart-info">
            <h3>${item.name.replaceAll("_"," ")}</h3>

            <p>Quantity: x${item.quantity}</p>

            <p>$${item.price.toFixed(2)} each</p>

            <p><strong>$${itemTotal.toFixed(2)}</strong></p>

            <!-- Remove button -->
            <button onclick="removeOne(${item.id})">Remove 1</button>
        </div>
    `;
        // Adds the div into a container in the webpage
    container.appendChild(div);
});

// The total price
document.getElementById("total-price").innerText =
    "Total: $" + total.toFixed(2);


// Function to remove items
function removeOne(id){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    // find index of one of the items to remove
    let index = cart.findIndex(item => item.id === id);

    if(index !== -1){
        cart.splice(index, 1); // remove ONLY one
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    location.reload(); // refresh cart
}
</script>

</body>
</html>
