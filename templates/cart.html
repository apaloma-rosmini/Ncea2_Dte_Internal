<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">

<title>Cart</title>

<style>
.cart-container {
    max-width: 1000px;
    margin: 50px auto;
    padding: 20px;
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid #ddd;
    padding: 20px 0;
}

.cart-item img {
    width: 120px;
    height: 120px;
    object-fit: contain;
}

.cart-info {
    flex: 1;
}

.cart-info h3 {
    margin: 0;
}

.cart-price {
    font-weight: bold;
}

.total-section {
    text-align: right;
    margin-top: 30px;
}

.btn {
    padding: 12px 25px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 10px;
}

.btn:hover {
    opacity: 0.8;
}

.back-btn {
    margin-bottom: 20px;
    display: inline-block;
}
</style>

</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">  
    <div class="logo">Walk By Faith</div>
    
    <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/collection">Shop Collection</a></li>
        <li><a href="/contact">Contact</a></li>
    </ul>

    <div class="nav-icons"> 
        <a href="/cart">
            <img src="{{ url_for('static', filename='images/Navbar/cart.png') }}">
        </a>
    </div>
</nav>

<div class="cart-container">

    <!-- 🔙 BACK BUTTON -->
    <button class="btn back-btn" onclick="window.history.back()">← Back</button>

    <h1>Your Cart</h1>

    <div id="cart-items"></div>

    <div class="total-section">
        <h2 id="total-price">Total: $0.00</h2>
        <a href="/checkout">
            <button class="btn">Checkout</button>
        </a>
    </div>

</div>

<script>
// GET CART
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// 🔥 GROUP ITEMS
let grouped = {};

cart.forEach(item => {
    if (!grouped[item.id]) {
        grouped[item.id] = {
            ...item,
            quantity: 1
        };
    } else {
        grouped[item.id].quantity++;
    }
});

const container = document.getElementById("cart-items");
let total = 0;

// DISPLAY ITEMS
Object.values(grouped).forEach(item => {

    let itemTotal = item.price * item.quantity;
    total += itemTotal;

    const div = document.createElement("div");
    div.classList.add("cart-item");

    div.innerHTML = `
        <img src="${item.image}">
        <div class="cart-info">
            <h3>${item.name.replaceAll("_"," ")}</h3>

            <p>Quantity: x${item.quantity}</p>

            <p>$${item.price.toFixed(2)} each</p>

            <p><strong>$${itemTotal.toFixed(2)}</strong></p>

            <!-- 🔥 DELETE BUTTON -->
            <button onclick="removeOne(${item.id})">Remove 1</button>
        </div>
    `;

    container.appendChild(div);
});

// TOTAL
document.getElementById("total-price").innerText =
    "Total: $" + total.toFixed(2);


// 🔥 REMOVE ONE ITEM FUNCTION
function removeOne(id){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    // find index of ONE item to remove
    let index = cart.findIndex(item => item.id === id);

    if(index !== -1){
        cart.splice(index, 1); // remove ONLY one
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    location.reload(); // refresh cart
}
</script>

</body>
</html>
