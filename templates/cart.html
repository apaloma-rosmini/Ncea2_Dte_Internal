<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="{{ url_for('static', filename='css/cart.css') }}">

<title>Cart</title>


</head>
<body>


<div class="cart_container">

<!-- Back Button -->
<button class="button back-button" onclick="window.history.back()"> <-- Back</button>     <!-- Back button to previous page -->

    <h1>Your Cart</h1>

    <div id="cart-items"></div>

    <!-- Display Total Section -->
    <div class="total_section">
        <h2 id="total_price">Total: $0.00</h2>    <!-- Price starts at $0.00 -->
        
        <a href="/checkout">
            <button class="button">Checkout</button>
        </a>
    </div>

</div>

<script>

// Retrieves cart data
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// Groups duplicate items BY ID + SIZE
let grouped = {};

cart.forEach(item => {

    // unique key = product id + size
    let key = item.id + "-" + item.size;

    if (!grouped[key]) {

        grouped[key] = {
            ...item,
            quantity: 1
        };

    } else {

        grouped[key].quantity++;

    }
});

const container = document.getElementById("cart-items");

let total = 0;


// Displays items
Object.values(grouped).forEach(item => {

    let itemTotal = item.price * item.quantity;

    total += itemTotal;

    const div = document.createElement("div");

    div.classList.add("cart-item");

    div.innerHTML = `
        <img src="${item.image}">

        <div class="cart-info">

            <h3>${item.name.replaceAll("_"," ")}</h3>

            <p><strong>Size:</strong> ${item.size}</p>

            <p>Quantity: x${item.quantity}</p>

            <p>$${item.price.toFixed(2)} each</p>

            <p><strong>$${itemTotal.toFixed(2)}</strong></p>

            <button onclick='removeOne(${item.id}, "${item.size}")'>
            Remove 1
    </button>
        </div>
    `;

    container.appendChild(div);
});


// Total Price
document.getElementById("total_price").innerText =
    "Total: $" + total.toFixed(2);


// Remove ONE item
function removeOne(id, size){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    // Find SAME item + SAME size
    let index = cart.findIndex(function(item){

        return Number(item.id) === Number(id)
            && String(item.size) === String(size);

    });

    // Remove ONE item
    if(index > -1){

        cart.splice(index, 1);

    }

    // Save updated cart
    localStorage.setItem("cart", JSON.stringify(cart));

    // Reload page
    location.reload();
}

</script>
</body>
</html>
